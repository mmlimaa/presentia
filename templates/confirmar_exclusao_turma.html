{% extends "base.html" %}
{% block title %}Excluir Turma{% endblock %}
{% block content_logado %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200 text-center">
    <div class="text-red-500 mb-4">
        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
    </div>
    <h3 class="text-2xl font-bold text-gray-800 mb-2">Excluir Turma?</h3>
    <p class="text-gray-600 mb-6">Tem certeza que deseja excluir a turma <strong>{{ turma.nome }}</strong>? Esta ação não pode ser desfeita.</p>
    
    <form method="POST" class="flex justify-center space-x-4">
        {% csrf_token %}
        <a href="{% url 'turmas_lista' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-6 rounded-lg transition">Cancelar</a>
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg shadow transition">Sim, Excluir</button>
    </form>
</div>
{% endblock %}

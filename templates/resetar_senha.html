{% extends "base.html" %}
{% block title %}Resetar Senha{% endblock %}
{% block content_logado %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <h3 class="text-2xl font-bold text-gray-800 mb-2">Resetar Senha</h3>
    <p class="text-gray-500 text-sm mb-6">Definir nova senha para <strong>{{ usuario.nome_completo }}</strong>.</p>
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nova Senha (6 a 16 caracteres)</label>
            <input type="password" name="nova_senha" required minlength="6" maxlength="16" class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500">
        </div>
        <div class="flex justify-end space-x-3 pt-4">
            <a href="{% url 'gerenciar_usuarios' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg transition">Cancelar</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow transition">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}

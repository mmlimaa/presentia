{% extends "base.html" %}
{% block title %}Importar Financeiro{% endblock %}
{% block content_logado %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <h3 class="text-2xl font-bold text-gray-800 mb-2">Importar Planilha Financeira</h3>
    <p class="text-gray-500 text-sm mb-6">Selecione a turma e envie o arquivo CSV exportado do Google Sheets.</p>
    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Turma Destino</label>
            <select name="turma" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500">
                <option value="">Selecione...</option>
                {% for t in turmas %}
                <option value="{{ t.id }}">{{ t.nome }} - {{ t.nucleo.nome }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Arquivo (CSV)</label>
            <input type="file" name="planilha" accept=".csv" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 bg-gray-50">
        </div>
        <div class="flex justify-end pt-4">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow transition">Processar Planilha</button>
        </div>
    </form>
</div>
{% endblock %}

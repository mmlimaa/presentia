{% extends "base.html" %}
{% block title %}Excluir Usuário{% endblock %}
{% block content_logado %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200 text-center mt-10">
    <div class="text-red-500 mb-4">
        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
    </div>
    <h3 class="text-2xl font-bold text-gray-800 mb-2">Excluir Usuário?</h3>
    <p class="text-gray-600 mb-6">Tem certeza que deseja excluir o acesso de <strong>{{ usuario.nome_completo }}</strong>? Esta ação não pode ser desfeita.</p>
    
    <form method="POST" class="flex justify-center space-x-4">
        {% csrf_token %}
        <a href="{% url 'gerenciar_usuarios' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-6 rounded-lg transition">Cancelar</a>
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg shadow transition">Sim, Excluir</button>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Excluir Aluno Experimental{% endblock %}
{% block content_logado %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200 text-center mt-10">
    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
    </div>
    <h3 class="text-xl font-bold text-gray-800 mb-2">Excluir Aluno Experimental?</h3>
    <p class="text-gray-500 mb-6">Tem certeza que deseja excluir o aluno <strong>{{ aluno.nome_completo }}</strong>? Esta ação não pode ser desfeita.</p>
    
    <form method="POST" class="flex justify-center gap-3">
        {% csrf_token %}
        <a href="{% url 'lista_alunos_experimentais' %}?turma={{ turma_id }}" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">Cancelar</a>
        <button type="submit" class="px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">Sim, Excluir</button>
    </form>
</div>
{% endblock %}

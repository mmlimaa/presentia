[project]
name = "presentia"
version = "0.1.0"
description = "Sistema de Controle de Frequencia - Presentia"
authors = [{ name = "Faculdade Vitoria em Cristo" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "django-environ>=0.12,<1.0",
    "uuid-utils>=0.10,<1.0",
    "python-dateutil>=2.9,<3.0",
    "django-stubs-ext>=5.1",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "django-stubs[compatible-mypy]>=5.1,<6.0",
    "djangorestframework-stubs>=3.15,<4.0",
]
test = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=6.0,<7.0",
    "factory-boy>=3.3,<4.0",
    "freezegun>=1.5,<2.0",
]

[tool.poetry]
packages = [{ include = "presentia" }, { include = "config" }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
